name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contract:
    name: Soroban tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Run contract tests
        run: cargo test -p celerity

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celerity-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: celerity-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
